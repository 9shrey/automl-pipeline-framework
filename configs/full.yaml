# Benchmark budget — full search space, longer time budget.
task: "classification"
target: "y"
time_budget_seconds: 7200
n_trials: 1000
seed: 42
n_jobs: -1

cv:
  scheme: "stratified_kfold"
  n_splits: 5
  shuffle: true

search:
  sampler: "tpe"
  pruner: "asha"
  warm_start:
    enabled: true
    top_k_neighbors: 10
    min_overlap_meta_features: 0.6
  space:
    imputation: ["mean", "median", "most_frequent", "iterative", "knn"]
    encoding:   ["onehot", "ordinal", "target", "frequency"]
    scaling:    ["standard", "robust", "minmax", "quantile", "none"]
    feature_selection: ["none", "variance", "mutual_info", "rfe", "shap"]
    models:     ["xgboost", "lightgbm", "catboost", "histgb", "logreg", "rf", "extratrees"]

ensembling:
  enabled: true
  strategy: "stacking"
  top_k: 10
  diversity: "metric_pareto"
  meta_learner: "lightgbm"

explain:
  enabled: true
  shap_max_samples: 2000
  permutation_repeats: 20

run:
  out_dir: "runs"
  mlflow:
    enabled: false
    tracking_uri: "file:./mlruns"

meta_store:
  path: ".automl_meta.sqlite"
  enabled: true
