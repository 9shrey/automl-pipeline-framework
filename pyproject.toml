[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "automl"
version = "0.1.0"
description = "Production-grade AutoML pipeline framework with joint search, meta-learning warm-start, ensembling, and SHAP explainability."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "9shrey" }]
keywords = [
    "automl", "hyperparameter-optimization", "optuna", "tpe", "asha",
    "bayesian-optimization", "stacking", "shap", "meta-learning",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "optuna>=3.6",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.45",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "joblib>=1.4",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbconvert>=7.16",
]
mlflow = ["mlflow>=2.13"]
openml = ["openml>=0.14"]

[project.scripts]
automl = "automl.cli:app"

[project.urls]
Repository = "https://github.com/9shrey/automl-pipeline-framework"

[tool.hatch.build.targets.wheel]
packages = ["src/automl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/automl"]
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: end-to-end tests",
    "property: hypothesis-based property tests",
]

[tool.coverage.run]
source = ["src/automl"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
